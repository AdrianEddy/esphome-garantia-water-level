; U3: STM32G0B1KCU6 on the KNX island of garantia-knx-direct. Two images (src/shared/u3_shared.h):
;   u3_boot  boot manager, 0x0800 0000, 4 KB: starts the ROM USB DFU bootloader when SW1 is held at reset
;   u3_app   KNX application (thelsing/knx), 0x0800 1000
; Building both writes build/garantia-knx-u3-full.bin/.hex for DFU (../README.md "Flashing").
; Build:  uvx --from platformio pio run

[platformio]
default_envs = u3_boot, u3_app

[u3_common]
platform = ststm32
board = stm32g0b1kc
framework = cmsis
build_flags =
  -Os -ffunction-sections -fdata-sections
  -Wall -Wextra -Wno-unused-parameter
  -Isrc/app
  -Wl,--gc-sections

[env:u3_app]
extends = u3_common
board_build.ldscript = ld/app.ld
build_src_filter = +<app/>
lib_deps = knx=symlink://../knx-thelsing
lib_ldf_mode = deep+
build_flags = ${u3_common.build_flags}
  -Wl,-Map,u3_app.map
  -D MASK_VERSION=0x07B0
  -D NCN5120                 ; NCN51xx protocol extras (U_SetAddress dummy byte, frame-end markers)
  -D KNX_FLASH_SIZE=4096     ; = U3_KNX_DATA_SIZE, bank 2
  -D KNX_NO_PRINT
  -D KNX_BARE_METAL          ; bits.h: byte-order macros without an Arduino core
  -D KNX_NO_AUTOMATIC_GLOBAL_INSTANCE
  -D USE_TP_RX_QUEUE         ; bytes and ACK decisions in the USART1 interrupt, frames in the loop
  -D KNX_NCN_ACR0=0x14       ; design.md "Firmware notes": XCLKEN on (XCLK clocks TIM2), DC2EN and V20VEN off
  -D U3_DEBUG_LOG=1          ; text log on TP7 (PA2, USART2_TX, 115200 8N1); 0 = off
extra_scripts = post:tools/post_app.py

[env:u3_boot]
extends = u3_common
board_build.ldscript = ld/boot.ld
build_src_filter = +<boot/>
lib_ignore = knx
build_flags = ${u3_common.build_flags}
  -Wl,-Map,u3_boot.map
extra_scripts = post:tools/post_boot.py
